{% set name = "pycdlib" %}
{% set version = "1.20.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pycdlib-{{ version }}.tar.gz
  sha256: 1d768eb491d761a3bace188270f152ef40f33fb0d3daf6cf39bc38a81272072c

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python

test:
  imports:
    - pycdlib
  commands:
    - pip check
  requires:
    - pip

about:
  home: http://github.com/clalancette/pycdlib
  summary: Pure python ISO manipulation library
  license: LGPL-2.1-only
  license_file: COPYING

extra:
  recipe-maintainers:
    - ajaypnair09
